<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品分类 - AI智能商品管理系统</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/product.css">
  <link rel="stylesheet" href="../css/ai.css">
</head>
<body>
  <div id="app-layout"></div>

  <main class="page-content">
    <div class="page-header">
      <h2>商品分类</h2>
      <p>两级分类维护：一级分类 / 二级分类</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <span class="text-muted fs-13">共 <b id="totalCount">0</b> 个分类</span>
        <div class="spacer"></div>
        <button class="btn btn-default" id="refreshBtn" type="button">刷新</button>
        <button class="btn btn-primary" id="addRootBtn" type="button">+ 新增一级分类</button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>分类名称</th>
              <th>排序</th>
              <th>商品数量</th>
              <th>状态</th>
              <th>描述</th>
              <th class="actions">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/category.js"></script>
</body>
</html>
