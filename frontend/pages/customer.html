<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客户管理 - AI智能商品管理系统</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/product.css">
  <link rel="stylesheet" href="../css/ai.css">
</head>
<body>
  <div id="app-layout"></div>

  <main class="page-content">
    <div class="page-header">
      <h2>客户管理</h2>
      <p>客户信息维护与消费情况查看</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" class="form-control search-input" id="keyword" placeholder="姓名 / 手机号 / 邮箱">
        <select class="form-control" id="filterLevel">
          <option value="">全部等级</option>
          <option value="normal">普通客户</option>
          <option value="vip">VIP客户</option>
          <option value="svip">SVIP客户</option>
        </select>
        <button class="btn btn-primary" id="searchBtn" type="button">搜索</button>
        <button class="btn btn-default" id="resetBtn" type="button">重置</button>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="addBtn" type="button">+ 新增客户</button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>客户</th>
              <th>手机号</th>
              <th>邮箱</th>
              <th>等级</th>
              <th>消费次数</th>
              <th>累计消费</th>
              <th>最近购买</th>
              <th class="actions">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/customer.js"></script>
</body>
</html>
