<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI助手 - AI智能商品管理系统</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/ai.css">
</head>
<body>
  <div id="app-layout"></div>

  <main class="page-content">
    <div class="page-header">
      <h2>AI 助手</h2>
      <p>基于 RAG 知识库的智能问答，自动引用知识库资料</p>
    </div>

    <div class="ai-layout">
      <div class="card ai-side">
        <div class="card-head">
          <div class="card-title">💬 会话</div>
          <button class="btn-text" id="clearBtn" type="button">清空会话</button>
        </div>
        <div class="card-body">
          <div class="side-section-title">示例问题</div>
          <div id="examples"></div>
          <div class="side-section-title mt-16">历史记录</div>
          <div id="history"></div>
        </div>
      </div>

      <div class="card ai-main" id="chatHost"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/ai.js"></script>
</body>
</html>
