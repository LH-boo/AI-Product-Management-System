<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品管理 - AI智能商品管理系统</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/product.css">
  <link rel="stylesheet" href="../css/ai.css">
</head>
<body>
  <div id="app-layout"></div>

  <main class="page-content">
    <div class="page-header">
      <h2>商品管理</h2>
      <p>商品的新增、编辑、上下架与删除</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" class="form-control search-input" id="keyword" placeholder="商品名称 / SKU">
        <select class="form-control" id="filterCategory">
          <option value="">全部分类</option>
        </select>
        <select class="form-control" id="filterStatus">
          <option value="">全部状态</option>
          <option value="1">已上架</option>
          <option value="0">已下架</option>
        </select>
        <button class="btn btn-primary" id="searchBtn" type="button">搜索</button>
        <button class="btn btn-default" id="resetBtn" type="button">重置</button>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="addBtn" type="button">+ 新增商品</button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>商品</th>
              <th>SKU</th>
              <th>分类</th>
              <th>品牌</th>
              <th>售价</th>
              <th>库存</th>
              <th>销量</th>
              <th>状态</th>
              <th class="actions">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/product.js"></script>
</body>
</html>
