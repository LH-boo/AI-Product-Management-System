<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单管理 - AI智能商品管理系统</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/product.css">
  <link rel="stylesheet" href="../css/ai.css">
</head>
<body>
  <div id="app-layout"></div>

  <main class="page-content">
    <div class="page-header">
      <h2>订单管理</h2>
      <p>订单查询、创建、状态流转与取消</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" class="form-control search-input" id="keyword" placeholder="订单号 / 下单人">
        <select class="form-control" id="filterStatus">
          <option value="">全部状态</option>
          <option value="pending">待付款</option>
          <option value="paid">已付款</option>
          <option value="to_ship">待发货</option>
          <option value="shipped">已发货</option>
          <option value="completed">已完成</option>
          <option value="cancelled">已取消</option>
        </select>
        <button class="btn btn-primary" id="searchBtn" type="button">搜索</button>
        <button class="btn btn-default" id="resetBtn" type="button">重置</button>
        <div class="spacer"></div>
        <button class="btn btn-primary" id="addBtn" type="button">+ 新建订单</button>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>订单号</th>
              <th>客户</th>
              <th>订单金额</th>
              <th>状态</th>
              <th>下单时间</th>
              <th class="actions">操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/order.js"></script>
</body>
</html>
